schema: spec-driven

context: |
  Stack: Node.js >=20, TypeScript, MCP server "Compendio". Hexagonal
  architecture — pure src/domain/, use cases in src/application/, adapters
  in src/infrastructure/ (better-sqlite3+sqlite-vec, transformers.js,
  remark+gray-matter, fs). Seams in src/domain/ports.ts.
  Testing: Vitest, pool "forks" (native addon — do not change). No lint/
  coverage scripts configured. Full details: CLAUDE.md, openspec/testing-capabilities.md.
  Language contract (revised 2026-07-25, supersedes the previous EN/ES split):
  the project is moving to English everywhere — identifiers, MCP tool contract,
  response fields, CLI options, SQLite columns, config keys and frontmatter
  keys. The single deliberate exception is the ejemplos/ corpus and
  goldenset.yaml, which stay Spanish: they are the retrieval regression suite
  and the evidence that an English codebase indexes Spanish documentation.
  Do not translate them.

strict_tdd: true

testing:
  test_command: "npm test"
  test_watch_command: "npm run test:watch"
  typecheck_command: "npm run typecheck"
  build_command: "npm run build"
  lint_command: null
  format_command: null
  coverage_command: null
  details_file: openspec/testing-capabilities.md

rules:
  proposal:
    - Include a rollback plan for risky changes.
    - "The project is in beta with no installed users. Breaking the public
      contract (MCP params, config keys, frontmatter keys, SQLite schema) is
      an accepted cost, not a risk to mitigate (explicit user decision,
      2026-07-24 and reaffirmed 2026-07-25). Do not design migrations,
      schema markers or compatibility shims unless asked."
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - MCP tool params and response fields are English (path, title, summary,
      type, module, status, tags, section, excerpt, skipped, indexed,
      embeddingsWarning). The former Spanish contract is retired.
  design:
    - Include sequence/flow notes for non-trivial flows (e.g. inference-based
      classification, config-driven convention resolution).
    - Document architecture decisions with rationale.
    - Keep src/domain/ free of SQLite/transformers.js/filesystem dependencies;
      route any new adapter through src/domain/ports.ts.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    guidelines:
      - Follow existing hexagonal patterns; new adapters implement ports.ts.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - Confirm openspec/specs/ carries no residual Spanish contract vocabulary
      (ruta, tipo, modulo, estado, etiquetas, seccion, omitidos, indexados,
      avisoEmbeddings, convencion, estadosExcluidos, camposFrontmatter)
      before archiving, except where it quotes the ejemplos/ corpus.
