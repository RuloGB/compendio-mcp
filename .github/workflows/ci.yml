name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every cell reports independently. A failure in one must not cancel the
      # rest: the point of this matrix is knowing *which* platform and *which*
      # Node broke, and both the README's platform badge and the `engines`
      # floor are only as honest as that per-cell signal.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          # The exact `engines.node` floor. It is pinned rather than expressed
          # as a range because a floor is a per-platform claim: better-sqlite3
          # publishes prebuilt binaries per Node ABI *and* per platform, and the
          # previous floor (">=20") was false on win32-x64 alone. Only running
          # the declared minimum on every platform can catch that.
          # Quoted so YAML keeps them as strings: an unquoted version is parsed
          # as a number, and a trailing zero (22.20 -> 22.2) would silently
          # resolve to a different Node than the one declared here.
          - "22.12.0"
          # Latest 22.x, so the supported range is exercised at both ends.
          - "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Same reasoning as release.yml: `npm ci` runs dependency install
          # scripts, so no token is left behind in .git/config for them to read.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 resolves a prebuilt binary per platform (falling back to
      # node-gyp) and sqlite-vec pulls its own per-platform package, so this
      # step is where a platform claim actually gets tested.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
